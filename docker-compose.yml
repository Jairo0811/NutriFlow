services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: NutriFlowDb
      POSTGRES_USER: nutriflow
      POSTGRES_PASSWORD: nutriflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nutriflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutriflow -d NutriFlowDb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nutriflow-postgres:
