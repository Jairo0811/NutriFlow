services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-NutriFlowDb}
      POSTGRES_USER: ${POSTGRES_USER:-nutriflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutriflow_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nutriflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutriflow} -d ${POSTGRES_DB:-NutriFlowDb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NutriFlow: Host=postgres;Port=5432;Database=${POSTGRES_DB:-NutriFlowDb};Username=${POSTGRES_USER:-nutriflow};Password=${POSTGRES_PASSWORD:-nutriflow_dev_password}
      Jwt__SigningKey: ${Jwt__SigningKey:-nutriflow-development-only-signing-key-change-before-production-2026}
      Jwt__GoogleClientIds__0: ${Jwt__GoogleClientIds__0:-}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-http://localhost:8081}
      OpenAI__ApiKey: ${OpenAI__ApiKey:-}
      OpenAI__Model: ${OpenAI__Model:-gpt-5.4}
      OpenAI__BaseUrl: ${OpenAI__BaseUrl:-https://api.openai.com/v1}
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  nutriflow-postgres:
