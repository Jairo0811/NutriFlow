name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore apps/api/src/NutriFlow.Api/NutriFlow.Api.csproj

      - name: Build
        run: dotnet build apps/api/src/NutriFlow.Api/NutriFlow.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/NutriFlow.Application.Tests/NutriFlow.Application.Tests.csproj --configuration Release

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build API container
        run: docker build -f apps/api/Dockerfile -t nutriflow-api:ci .

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Report high production dependency advisories
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Block critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Type check
        run: npm run typecheck
