name: Simplify continuity table labels

on:
  push:
    branches:
      - 'docs/simplify-continuity-table-labels'
    paths:
      - '.github/workflows/simplify-continuity-labels.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/simplify-continuity-table-labels
      - name: Simplify labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Estudiante recurrente', 'Estudiante')
          s = s.replace('Profesor recurrente', 'Profesor')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: simplify academic continuity labels"
          git push origin HEAD:docs/simplify-continuity-table-labels
