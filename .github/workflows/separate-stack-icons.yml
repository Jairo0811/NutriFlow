name: Separate stack icons

on:
  push:
    branches:
      - 'docs/separate-stack-icons'
    paths:
      - '.github/workflows/separate-stack-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/separate-stack-icons
      - run: python .github/scripts/patch-stack-icons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: separate mobile backend data and DevOps icons"
          git push origin HEAD:docs/separate-stack-icons
